---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: my-kde-image
description: A Fedora bootc image with KDE Plasma and cowsay.

# Fedora bootc base image
base-image: quay.io/fedora/fedora-bootc
image-version: latest

modules:
  # Install KDE Plasma and a few basic KDE components
  - type: dnf
    install:
      packages:
        - plasma-desktop
        - plasma-workspace
        - sddm
        - dolphin
        - cowsay

  # Enable SDDM so KDE can start
  - type: systemd
    system:
      enabled:
        - sddm.service

  # Set up signing for the image
  - type: signing
